[project]
name = "conqr-denny-legal"
version = "0.1.0"
description = "Legal knowledge graph + retrieval over Denny's credit agreement and amendments"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    "boto3>=1.34",
    "sentence-transformers>=5.6",
    "scikit-learn>=1.4",  # AgglomerativeClustering for eval/generate_clustered_qa.py
]

[project.optional-dependencies]
retrieval = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    # experiment-only: pylate for the ColBERT candidate in embedder_comparison.py;
    # bitsandbytes/accelerate for the 4-bit HF candidates in llm_comparison.py.
    # The live answer path needs neither (pre-quantized GGUF via llama-cpp).
    "pylate>=1.0",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
]
local-llm = [
    "llama-cpp-python>=0.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "ipykernel>=7.0",
    "matplotlib>=3.11.2",
    "pyvis>=0.3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "graph", "retrieval", "baseline", "llm", "eval"]
